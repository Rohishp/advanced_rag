name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    # The suite needs no API keys and no network beyond installing packages: OpenAI, Tavily
    # and LangSmith are replaced by local fake servers (tests/_support.py).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_all.py
